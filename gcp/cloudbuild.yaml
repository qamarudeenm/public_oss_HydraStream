steps:
  # ─────────────────────────────────────────────────────────────────
  # 1. Build: Flink Engine (JobManager + TaskManager + SQL Gateway)
  # ─────────────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-flink-engine'
    args:
      - 'build'
      - '-t'
      - '${_REGISTRY}/${PROJECT_ID}/hydrastream/engine:flink1.19.1'
      - '-t'
      - '${_REGISTRY}/${PROJECT_ID}/hydrastream/engine:${SHORT_SHA}'
      - '-f'
      - 'streaming_infra/flink/Dockerfile'
      - 'streaming_infra/flink'

  # ─────────────────────────────────────────────────────────────────
  # 2. Build: Flink Proxy Gateway
  # ─────────────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-proxy-gateway'
    args:
      - 'build'
      - '-t'
      - '${_REGISTRY}/${PROJECT_ID}/hydrastream/proxy:latest'
      - '-t'
      - '${_REGISTRY}/${PROJECT_ID}/hydrastream/proxy:${SHORT_SHA}'
      - '-f'
      - 'streaming_infra/infra/flink-proxy-gateway/Dockerfile'
      - 'streaming_infra/infra/flink-proxy-gateway'

  # ─────────────────────────────────────────────────────────────────
  # 3. Build: dbt Worker
  # ─────────────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-dbt-worker'
    args:
      - 'build'
      - '-t'
      - '${_REGISTRY}/${PROJECT_ID}/hydrastream/dbt:latest'
      - '-t'
      - '${_REGISTRY}/${PROJECT_ID}/hydrastream/dbt:${SHORT_SHA}'
      - '-f'
      - 'streaming_infra/dbt/Dockerfile'
      - 'streaming_infra/dbt'

  # ─────────────────────────────────────────────────────────────────
  # 4. Build: Control Plane API (FastAPI)
  # ─────────────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-control-plane'
    args:
      - 'build'
      - '-t'
      - '${_REGISTRY}/${PROJECT_ID}/hydrastream/control-plane:latest'
      - '-t'
      - '${_REGISTRY}/${PROJECT_ID}/hydrastream/control-plane:${SHORT_SHA}'
      - '-f'
      - 'control_plane/backend/Dockerfile'
      - 'control_plane/backend'

  # ─────────────────────────────────────────────────────────────────
  # 5. Build: Frontend (Next.js)
  # ─────────────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    args:
      - 'build'
      - '-t'
      - '${_REGISTRY}/${PROJECT_ID}/hydrastream/frontend:latest'
      - '-t'
      - '${_REGISTRY}/${PROJECT_ID}/hydrastream/frontend:${SHORT_SHA}'
      - '-f'
      - 'control_plane/frontend/Dockerfile'
      - 'control_plane/frontend'

  # ─────────────────────────────────────────────────────────────────
  # 6. Push all images to Artifact Registry
  # ─────────────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-flink-engine'
    args: ['push', '--all-tags', '${_REGISTRY}/${PROJECT_ID}/hydrastream/engine']
    waitFor: ['build-flink-engine']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-proxy-gateway'
    args: ['push', '--all-tags', '${_REGISTRY}/${PROJECT_ID}/hydrastream/proxy']
    waitFor: ['build-proxy-gateway']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-dbt-worker'
    args: ['push', '--all-tags', '${_REGISTRY}/${PROJECT_ID}/hydrastream/dbt']
    waitFor: ['build-dbt-worker']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-control-plane'
    args: ['push', '--all-tags', '${_REGISTRY}/${PROJECT_ID}/hydrastream/control-plane']
    waitFor: ['build-control-plane']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend'
    args: ['push', '--all-tags', '${_REGISTRY}/${PROJECT_ID}/hydrastream/frontend']
    waitFor: ['build-frontend']

substitutions:
  # Artifact Registry host — override for MiniSky: localhost:2080
  _REGISTRY: '${_REGION}-docker.pkg.dev'
  _REGION: 'us-central1'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

images:
  - '${_REGISTRY}/${PROJECT_ID}/hydrastream/engine:flink1.19.1'
  - '${_REGISTRY}/${PROJECT_ID}/hydrastream/engine:${SHORT_SHA}'
  - '${_REGISTRY}/${PROJECT_ID}/hydrastream/proxy:latest'
  - '${_REGISTRY}/${PROJECT_ID}/hydrastream/proxy:${SHORT_SHA}'
  - '${_REGISTRY}/${PROJECT_ID}/hydrastream/dbt:latest'
  - '${_REGISTRY}/${PROJECT_ID}/hydrastream/dbt:${SHORT_SHA}'
  - '${_REGISTRY}/${PROJECT_ID}/hydrastream/control-plane:latest'
  - '${_REGISTRY}/${PROJECT_ID}/hydrastream/control-plane:${SHORT_SHA}'
  - '${_REGISTRY}/${PROJECT_ID}/hydrastream/frontend:latest'
  - '${_REGISTRY}/${PROJECT_ID}/hydrastream/frontend:${SHORT_SHA}'
