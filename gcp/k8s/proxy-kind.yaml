apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-proxy-gateway
  namespace: hydrastream
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flink-proxy
  template:
    metadata:
      labels:
        app: flink-proxy
    spec:
      containers:
        - name: proxy
          image: blue2berry/hydrastream:proxy-latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PROXY_FLINK_GATEWAY_URL
              value: "http://flink-sql-gateway.hydrastream.svc.cluster.local:8083"
            - name: PROXY_STATE_REDIS_URL
              value: "redis://redis.hydrastream.svc.cluster.local:6379/0"
            - name: PROXY_AUTH_MODE
              value: "passthrough"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: flink-proxy-gateway
  namespace: hydrastream
spec:
  selector:
    app: flink-proxy
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
