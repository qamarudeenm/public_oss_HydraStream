# Control Plane deployment for kind (no ESO, no Workload Identity)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hydrastream-control-plane
  namespace: hydrastream
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hydrastream-oidc-config
  namespace: hydrastream
data:
  OIDC_ISSUER_URL: "https://accounts.google.com"
  OIDC_CLIENT_ID: "placeholder-client-id.apps.googleusercontent.com"
  OIDC_REDIRECT_URI: "http://localhost:3000/api/auth/callback"
  CONTROL_PLANE_OIDC_ISSUER_URL: "https://accounts.google.com"
  CONTROL_PLANE_OIDC_AUDIENCE: "placeholder-client-id.apps.googleusercontent.com"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane-backend
  namespace: hydrastream
spec:
  replicas: 1
  selector:
    matchLabels:
      app: control-plane
      component: backend
  template:
    metadata:
      labels:
        app: control-plane
        component: backend
    spec:
      serviceAccountName: hydrastream-control-plane
      containers:
        - name: backend
          image: hydrastream/control-plane:ff9697b
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: CONTROL_PLANE_OIDC_ISSUER_URL
              valueFrom:
                configMapKeyRef:
                  name: hydrastream-oidc-config
                  key: CONTROL_PLANE_OIDC_ISSUER_URL
            - name: CONTROL_PLANE_OIDC_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: hydrastream-oidc-config
                  key: CONTROL_PLANE_OIDC_AUDIENCE
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hydrastream-backend-env
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: hydrastream-backend-env
                  key: REDIS_URL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane-backend
  namespace: hydrastream
spec:
  selector:
    app: control-plane
    component: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane-frontend
  namespace: hydrastream
spec:
  replicas: 1
  selector:
    matchLabels:
      app: control-plane
      component: frontend
  template:
    metadata:
      labels:
        app: control-plane
        component: frontend
    spec:
      serviceAccountName: hydrastream-control-plane
      containers:
        - name: frontend
          image: hydrastream/control-plane-frontend:ff9697b
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: OIDC_ISSUER_URL
              valueFrom:
                configMapKeyRef:
                  name: hydrastream-oidc-config
                  key: OIDC_ISSUER_URL
            - name: OIDC_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: hydrastream-oidc-config
                  key: OIDC_CLIENT_ID
            - name: OIDC_REDIRECT_URI
              valueFrom:
                configMapKeyRef:
                  name: hydrastream-oidc-config
                  key: OIDC_REDIRECT_URI
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hydrastream-backend-env
                  key: OIDC_CLIENT_SECRET
                  optional: true
            - name: NEXT_PUBLIC_API_URL
              value: "http://control-plane-backend.hydrastream.svc.cluster.local:8000"
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane-frontend
  namespace: hydrastream
spec:
  selector:
    app: control-plane
    component: frontend
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 3000
