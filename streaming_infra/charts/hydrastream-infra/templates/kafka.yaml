apiVersion: v1
kind: Service
metadata:
  name: {{ include "hydrastream-infra.fullname" . }}-kafka
  labels:
    {{- include "hydrastream-infra.labels" . | nindent 4 }}
spec:
  ports:
    - name: client
      port: 9092
      targetPort: 9092
  selector:
    {{- include "hydrastream-infra.selectorLabels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "hydrastream-infra.fullname" . }}-kafka
  labels:
    {{- include "hydrastream-infra.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "hydrastream-infra.fullname" . }}-kafka
  replicas: {{ .Values.kafka.replicaCount }}
  selector:
    matchLabels:
      {{- include "hydrastream-infra.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hydrastream-infra.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: kafka
          image: "{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"
          ports:
            - containerPort: 9092
          env:
            - name: KAFKA_NODE_ID
              value: {{ .Values.kafka.nodeId | quote }}
            - name: KAFKA_PROCESS_ROLES
              value: {{ .Values.kafka.processRoles | quote }}
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: {{ .Values.kafka.controllerQuorumVoters | quote }}
            - name: KAFKA_LISTENERS
              value: {{ .Values.kafka.listeners | quote }}
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://{{ include "hydrastream-infra.fullname" . }}-kafka:29092,EXTERNAL://localhost:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: {{ .Values.kafka.autoCreateTopics | quote }}
          resources:
            {{- toYaml .Values.kafka.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.kafka.storage.size }}
        {{- if .Values.kafka.storage.class }}
        storageClassName: {{ .Values.kafka.storage.class }}
        {{- end }}
