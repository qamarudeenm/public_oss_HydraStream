apiVersion: v2
name: hydrastream-infra
description: A Helm chart for deploying shared HydraStream infrastructure (e.g., Kafka, PostgreSQL)
type: application
version: 0.2.0
appVersion: "1.0.0"

dependencies:
  - name: postgresql
    version: "15.5.38"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
