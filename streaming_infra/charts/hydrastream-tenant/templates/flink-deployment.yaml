apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: {{ include "hydrastream-tenant.fullname" . }}-flink
  labels:
    {{- include "hydrastream-tenant.labels" . | nindent 4 }}
spec:
  image: {{ .Values.flink.image }}
  flinkVersion: {{ .Values.flink.version }}
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "2"
  serviceAccount: {{ include "hydrastream-tenant.serviceAccountName" . }}
  jobManager:
    resource:
      cpu: {{ .Values.flink.jobManager.resource.cpu }}
      memory: {{ .Values.flink.jobManager.resource.memory | quote }}
    replicas: {{ .Values.flink.jobManager.replicaCount }}
  taskManager:
    resource:
      cpu: {{ .Values.flink.taskManager.resource.cpu }}
      memory: {{ .Values.flink.taskManager.resource.memory | quote }}
    replicas: {{ .Values.flink.taskManager.replicaCount }}
