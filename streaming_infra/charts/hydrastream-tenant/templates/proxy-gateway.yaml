apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hydrastream-tenant.fullname" . }}-proxy
  labels:
    {{- include "hydrastream-tenant.labels" . | nindent 4 }}
    component: proxy
spec:
  replicas: {{ .Values.proxy.replicaCount }}
  selector:
    matchLabels:
      {{- include "hydrastream-tenant.selectorLabels" . | nindent 6 }}
      component: proxy
  template:
    metadata:
      labels:
        {{- include "hydrastream-tenant.selectorLabels" . | nindent 8 }}
        component: proxy
    spec:
      serviceAccountName: {{ include "hydrastream-tenant.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: proxy
          image: {{ .Values.proxy.image.repository }}:{{ .Values.proxy.image.tag }}
          securityContext:
            {{- toYaml .Values.proxy.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PROXY_FLINK_GATEWAY_URL
              value: "http://{{ include "hydrastream-tenant.fullname" . }}-sql-gateway:8083"
            - name: PROXY_LISTEN_HOST
              value: "0.0.0.0"
            - name: PROXY_LISTEN_PORT
              value: "8080"
            - name: PROXY_AUTH_MODE
              value: {{ .Values.proxy.auth.mode | quote }}
            - name: PROXY_OIDC_ISSUER_URL
              value: {{ .Values.proxy.auth.issuerUrl | quote }}
            - name: PROXY_JWT_AUDIENCE
              value: {{ .Values.proxy.auth.audience | quote }}
            - name: PROXY_JWT_ALGORITHMS
              value: {{ .Values.proxy.auth.algorithms | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.proxy.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hydrastream-tenant.fullname" . }}-proxy
  labels:
    {{- include "hydrastream-tenant.labels" . | nindent 4 }}
    component: proxy
spec:
  type: {{ .Values.proxy.service.type }}
  ports:
    - port: {{ .Values.proxy.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "hydrastream-tenant.selectorLabels" . | nindent 4 }}
    component: proxy
