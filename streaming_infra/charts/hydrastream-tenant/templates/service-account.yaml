{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hydrastream-tenant.serviceAccountName" . }}
  labels:
    {{- include "hydrastream-tenant.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "hydrastream-tenant.fullname" . }}-role
  labels:
    {{- include "hydrastream-tenant.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "delete", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "delete", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "hydrastream-tenant.fullname" . }}-rolebinding
  labels:
    {{- include "hydrastream-tenant.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "hydrastream-tenant.fullname" . }}-role
subjects:
  - kind: ServiceAccount
    name: {{ include "hydrastream-tenant.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
